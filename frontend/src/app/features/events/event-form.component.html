<div class="event-form">
  <h2>{{ isEditing ? 'Modifier l\'Événement' : 'Créer un Nouvel Événement' }}</h2>

  <form (ngSubmit)="onSubmit()" #eventForm="ngForm">
    <div class="form-group">
      <label for="title">Titre de l'Événement *</label>
      <input
        type="text"
        id="title"
        name="title"
        [(ngModel)]="formData.title"
        required
        class="form-control"
        placeholder="Entrez le titre de l'événement"
      />
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea
        id="description"
        name="description"
        [(ngModel)]="formData.description"
        class="form-control"
        rows="3"
        placeholder="Décrivez votre événement..."
      ></textarea>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="type">Type *</label>
        <select
          id="type"
          name="type"
          [(ngModel)]="formData.type"
          required
          class="form-control"
        >
          <option *ngFor="let option of typeOptions" [value]="option.value">
            {{ option.label }}
          </option>
        </select>
      </div>

      <div class="form-group">
        <label for="format">Format</label>
        <select
          id="format"
          name="format"
          [(ngModel)]="formData.format"
          class="form-control"
        >
          <option *ngFor="let option of formatOptions" [value]="option.value">
            {{ option.label }}
          </option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="startDate">Date de Début *</label>
        <input
          type="date"
          id="startDate"
          name="startDate"
          [(ngModel)]="formData.startDate"
          required
          class="form-control"
        />
      </div>

      <div class="form-group">
        <label for="endDate">Date de Fin *</label>
        <input
          type="date"
          id="endDate"
          name="endDate"
          [(ngModel)]="formData.endDate"
          required
          class="form-control"
        />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="location">Lieu</label>
        <input
          type="text"
          id="location"
          name="location"
          [(ngModel)]="formData.location"
          class="form-control"
          placeholder="Lieu de l'événement"
        />
      </div>

      <div class="form-group">
        <label for="maxCapacity">Capacité Maximale</label>
        <input
          type="number"
          id="maxCapacity"
          name="maxCapacity"
          [(ngModel)]="formData.maxCapacity"
          min="0"
          class="form-control"
          placeholder="0"
        />
      </div>
    </div>

    <div class="form-actions">
      <button type="button" (click)="onCancel()" class="btn-secondary">
        Annuler
      </button>
      <button type="submit" [disabled]="!eventForm.form.valid" class="btn-primary">
        {{ isEditing ? 'Mettre à Jour' : 'Créer l\'Événement' }}
      </button>
    </div>
  </form>
</div>
