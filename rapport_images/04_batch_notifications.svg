<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700">
  <defs>
    <linearGradient id="batchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667EEA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764BA2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="readerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#48BB78;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2F855A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="processorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ED8936;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C05621;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="writerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4299E1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2B6CB0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4A5568"/>
    </marker>
  </defs>
  
  <rect width="1100" height="700" fill="#f8fafc"/>
  
  <text x="550" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#1a365d">Systeme Batch - Traitement des Notifications</text>
  <text x="550" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#718096">Spring Batch avec envoi d emails via SMTP</text>
  
  <rect x="50" y="90" width="1000" height="350" rx="15" fill="white" stroke="#667EEA" stroke-width="3" filter="url(#shadow)"/>
  <rect x="50" y="90" width="1000" height="45" rx="15" fill="url(#batchGrad)"/>
  <rect x="50" y="120" width="1000" height="15" fill="url(#batchGrad)"/>
  <text x="550" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">processNotificationJob</text>
  
  <rect x="80" y="150" width="940" height="270" rx="10" fill="#F7FAFC" stroke="#CBD5E0" stroke-width="2"/>
  <text x="550" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4A5568">processNotificationStep (chunk size = 10)</text>
  
  <rect x="120" y="200" width="220" height="180" rx="10" fill="url(#readerGrad)" filter="url(#shadow)"/>
  <text x="230" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">ItemReader</text>
  <line x1="140" y1="245" x2="320" y2="245" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="230" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Lit les notifications</text>
  <text x="230" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">status = PENDING</text>
  <rect x="140" y="310" width="180" height="55" rx="5" fill="rgba(255,255,255,0.2)"/>
  <text x="230" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">- Page size: 100</text>
  <text x="230" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">- Sort: ID ASC</text>
  <text x="230" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">- JPA Repository</text>
  
  <line x1="340" y1="290" x2="420" y2="290" stroke="#4A5568" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="380" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#718096">batch</text>
  
  <rect x="440" y="200" width="220" height="180" rx="10" fill="url(#processorGrad)" filter="url(#shadow)"/>
  <text x="550" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">ItemProcessor</text>
  <line x1="460" y1="245" x2="640" y2="245" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="550" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Traite chaque notification</text>
  <rect x="460" y="285" width="180" height="80" rx="5" fill="rgba(255,255,255,0.2)"/>
  <text x="550" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Pour canal EMAIL:</text>
  <text x="550" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">- EmailService.sendEmail()</text>
  <text x="550" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">- Si OK: status = SENT</text>
  <text x="550" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">- Si KO: retryCount++</text>
  <text x="550" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">- Si retry = 3: FAILED</text>
  
  <line x1="660" y1="290" x2="740" y2="290" stroke="#4A5568" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="700" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#718096">item</text>
  
  <rect x="760" y="200" width="220" height="180" rx="10" fill="url(#writerGrad)" filter="url(#shadow)"/>
  <text x="870" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">ItemWriter</text>
  <line x1="780" y1="245" x2="960" y2="245" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="870" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Sauvegarde en base</text>
  <rect x="780" y="285" width="180" height="80" rx="5" fill="rgba(255,255,255,0.2)"/>
  <text x="870" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Met a jour:</text>
  <text x="870" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">- status (SENT/FAILED)</text>
  <text x="870" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">- sentDate</text>
  <text x="870" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">- deliveryStatus</text>
  <text x="870" y="367" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">- retryCount</text>
  
  <rect x="50" y="470" width="480" height="210" rx="10" fill="white" stroke="#CBD5E0" stroke-width="2" filter="url(#shadow)"/>
  <text x="290" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a365d">Types de Notifications</text>
  <line x1="70" y1="515" x2="510" y2="515" stroke="#E2E8F0" stroke-width="1"/>
  
  <rect x="70" y="530" width="140" height="35" rx="5" fill="#C6F6D5" stroke="#38A169" stroke-width="1"/>
  <text x="140" y="552" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#276749">WELCOME</text>
  
  <rect x="230" y="530" width="140" height="35" rx="5" fill="#BEE3F8" stroke="#3182CE" stroke-width="1"/>
  <text x="300" y="552" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2B6CB0">EVENT_REGISTRATION</text>
  
  <rect x="390" y="530" width="120" height="35" rx="5" fill="#FEEBC8" stroke="#DD6B20" stroke-width="1"/>
  <text x="450" y="552" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#C05621">EVENT_REMINDER</text>
  
  <rect x="70" y="580" width="140" height="35" rx="5" fill="#E9D8FD" stroke="#805AD5" stroke-width="1"/>
  <text x="140" y="602" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#6B46C1">CAMPAIGN_UPDATE</text>
  
  <rect x="230" y="580" width="140" height="35" rx="5" fill="#FED7D7" stroke="#E53E3E" stroke-width="1"/>
  <text x="300" y="602" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#C53030">SYSTEM_ALERT</text>
  
  <text x="290" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4A5568">Canaux:</text>
  <text x="290" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#718096">EMAIL (SMTP) | SMS (simule) | PUSH (simule) | IN_APP</text>
  
  <rect x="570" y="470" width="480" height="210" rx="10" fill="white" stroke="#CBD5E0" stroke-width="2" filter="url(#shadow)"/>
  <text x="810" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a365d">Statuts et Flux</text>
  <line x1="590" y1="515" x2="1030" y2="515" stroke="#E2E8F0" stroke-width="1"/>
  
  <rect x="600" y="540" width="90" height="40" rx="8" fill="#FEEBC8" stroke="#DD6B20" stroke-width="2"/>
  <text x="645" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#C05621">PENDING</text>
  
  <line x1="690" y1="560" x2="750" y2="560" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>
  
  <rect x="770" y="530" width="80" height="30" rx="8" fill="#C6F6D5" stroke="#38A169" stroke-width="2"/>
  <text x="810" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#276749">SENT</text>
  
  <rect x="770" y="570" width="80" height="30" rx="8" fill="#FED7D7" stroke="#E53E3E" stroke-width="2"/>
  <text x="810" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#C53030">FAILED</text>
  
  <line x1="850" y1="545" x2="910" y2="545" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>
  
  <rect x="930" y="530" width="80" height="30" rx="8" fill="#BEE3F8" stroke="#3182CE" stroke-width="2"/>
  <text x="970" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2B6CB0">READ</text>
  
  <rect x="600" y="620" width="420" height="50" rx="8" fill="#F7FAFC" stroke="#A0AEC0" stroke-width="1"/>
  <text x="810" y="642" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#4A5568">Retry Logic:</text>
  <text x="810" y="658" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#718096">Max 3 tentatives | Si echec apres 3: status = FAILED</text>
  
  <rect x="850" y="95" width="180" height="35" rx="8" fill="#EDF2F7" stroke="#A0AEC0" stroke-width="1"/>
  <text x="940" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#4A5568">Trigger: POST /api/notifications</text>
  <text x="940" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#718096">/batch/process</text>
</svg>
