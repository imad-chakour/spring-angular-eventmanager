  <rect width="1000" height="700" fill="#f8fafc"/>
  
  <text x="500" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1a365d">Communication Inter-Services (OpenFeign)</text>
