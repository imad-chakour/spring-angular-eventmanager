  <text x="470" y="664" font-family="Arial, sans-serif" font-size="10" fill="#4A5568">Campaign Service</text>
  
  <line x1="600" y1="660" x2="640" y2="660" stroke="#DD6B20" stroke-width="3"/>
  <text x="650" y="664" font-family="Arial, sans-serif" font-size="10" fill="#4A5568">Analytics Service</text>
  
  <line x1="780" y1="660" x2="820" y2="660" stroke="#E53E3E" stroke-width="3" stroke-dasharray="5,5"/>
