<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="650" fill="#FDF6E3"/>
  <rect x="10" y="10" width="880" height="630" fill="#FFFBEB" stroke="#D4A574" stroke-width="2" rx="5"/>
  
  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#5D4037">
    Diagramme de Contexte - Acteurs du Systeme EventFlow_2025
  </text>
  
  <!-- Central System Box -->
  <rect x="350" y="270" width="200" height="80" fill="white" stroke="#5D4037" stroke-width="2" filter="url(#shadow)"/>
  <polygon points="530,295 545,310 530,325" fill="#5D4037"/>
  <text x="450" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#5D4037">Plateforme</text>
  <text x="450" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#5D4037">EventFlow_2025</text>
  
  <!-- Actor 1: Systeme (Top) -->
  <g transform="translate(450, 120)">
    <!-- Head -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="#5D4037" stroke-width="2"/>
    <!-- Body -->
    <line x1="0" y1="18" x2="0" y2="55" stroke="#5D4037" stroke-width="2"/>
    <!-- Arms -->
    <line x1="-25" y1="35" x2="25" y2="35" stroke="#5D4037" stroke-width="2"/>
    <!-- Legs -->
    <line x1="0" y1="55" x2="-20" y2="85" stroke="#5D4037" stroke-width="2"/>
    <line x1="0" y1="55" x2="20" y2="85" stroke="#5D4037" stroke-width="2"/>
    <!-- Label -->
    <text x="0" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5D4037">Systeme</text>
    <text x="0" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#8B7355">(Batch/Analytics)</text>
  </g>
  
  <!-- Arrow from Systeme to Central -->
  <line x1="450" y1="245" x2="450" y2="268" stroke="#5D4037" stroke-width="1.5" stroke-dasharray="6,3"/>
  <polygon points="450,270 445,260 455,260" fill="#5D4037"/>
  <text x="520" y="250" font-family="Arial, sans-serif" font-size="11" fill="#5D4037">Automatisation interne</text>
  
  <!-- Actor 2: Participant (Left) -->
  <g transform="translate(100, 310)">
    <!-- Head -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="#5D4037" stroke-width="2"/>
    <!-- Body -->
    <line x1="0" y1="18" x2="0" y2="55" stroke="#5D4037" stroke-width="2"/>
    <!-- Arms -->
    <line x1="-25" y1="35" x2="25" y2="35" stroke="#5D4037" stroke-width="2"/>
    <!-- Legs -->
    <line x1="0" y1="55" x2="-20" y2="85" stroke="#5D4037" stroke-width="2"/>
    <line x1="0" y1="55" x2="20" y2="85" stroke="#5D4037" stroke-width="2"/>
    <!-- Label -->
    <text x="0" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5D4037">Participant</text>
    <text x="0" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#8B7355">(Utilisateur)</text>
  </g>
  
  <!-- Arrow from Participant to Central -->
  <line x1="135" y1="310" x2="345" y2="310" stroke="#5D4037" stroke-width="1.5" stroke-dasharray="6,3"/>
  <polygon points="348,310 338,305 338,315" fill="#5D4037"/>
  <text x="200" y="295" font-family="Arial, sans-serif" font-size="11" fill="#5D4037">Interagit avec les evenements,</text>
  <text x="200" y="308" font-family="Arial, sans-serif" font-size="11" fill="#5D4037">s inscrit aux campagnes</text>
  
  <!-- Actor 3: Systeme de notification (Right) -->
  <g transform="translate(800, 310)">
    <!-- Head -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="#5D4037" stroke-width="2"/>
    <!-- Body -->
    <line x1="0" y1="18" x2="0" y2="55" stroke="#5D4037" stroke-width="2"/>
    <!-- Arms -->
    <line x1="-25" y1="35" x2="25" y2="35" stroke="#5D4037" stroke-width="2"/>
    <!-- Legs -->
    <line x1="0" y1="55" x2="-20" y2="85" stroke="#5D4037" stroke-width="2"/>
    <line x1="0" y1="55" x2="20" y2="85" stroke="#5D4037" stroke-width="2"/>
    <!-- Label -->
    <text x="0" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5D4037">Systeme de</text>
    <text x="0" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5D4037">notification</text>
    <text x="0" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#8B7355">(SMTP/Email)</text>
  </g>
  
  <!-- Arrow from Central to Notification -->
  <line x1="552" y1="310" x2="762" y2="310" stroke="#5D4037" stroke-width="1.5" stroke-dasharray="6,3"/>
  <polygon points="765,310 755,305 755,315" fill="#5D4037"/>
  <text x="655" y="295" font-family="Arial, sans-serif" font-size="11" fill="#5D4037">Diffusion externe</text>
  <text x="655" y="308" font-family="Arial, sans-serif" font-size="11" fill="#5D4037">(emails, alertes)</text>
  
  <!-- Actor 4: Admin (Bottom Left) -->
  <g transform="translate(200, 520)">
    <!-- Head -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="#5D4037" stroke-width="2"/>
    <!-- Body -->
    <line x1="0" y1="18" x2="0" y2="55" stroke="#5D4037" stroke-width="2"/>
    <!-- Arms -->
    <line x1="-25" y1="35" x2="25" y2="35" stroke="#5D4037" stroke-width="2"/>
    <!-- Legs -->
    <line x1="0" y1="55" x2="-20" y2="85" stroke="#5D4037" stroke-width="2"/>
    <line x1="0" y1="55" x2="20" y2="85" stroke="#5D4037" stroke-width="2"/>
    <!-- Label -->
    <text x="0" y="-30" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5D4037">Admin</text>
    <text x="0" y="-15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#8B7355">(Administrateur)</text>
  </g>
  
  <!-- Arrow from Admin to Central -->
  <line x1="230" y1="480" x2="380" y2="355" stroke="#5D4037" stroke-width="1.5" stroke-dasharray="6,3"/>
  <polygon points="383,352 373,358 377,348" fill="#5D4037"/>
  <text x="260" y="430" font-family="Arial, sans-serif" font-size="11" fill="#5D4037">Supervise et maintient</text>
  <text x="260" y="445" font-family="Arial, sans-serif" font-size="11" fill="#5D4037">la plateforme, gere users</text>
  
  <!-- Actor 5: Marketeur/Organisateur (Bottom Right) -->
  <g transform="translate(700, 520)">
    <!-- Head -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="#5D4037" stroke-width="2"/>
    <!-- Body -->
    <line x1="0" y1="18" x2="0" y2="55" stroke="#5D4037" stroke-width="2"/>
    <!-- Arms -->
    <line x1="-25" y1="35" x2="25" y2="35" stroke="#5D4037" stroke-width="2"/>
    <!-- Legs -->
    <line x1="0" y1="55" x2="-20" y2="85" stroke="#5D4037" stroke-width="2"/>
    <line x1="0" y1="55" x2="20" y2="85" stroke="#5D4037" stroke-width="2"/>
    <!-- Label -->
    <text x="0" y="-30" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5D4037">Organisateur</text>
    <text x="0" y="-15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#8B7355">(Marketeur)</text>
  </g>
  
  <!-- Arrow from Marketeur to Central -->
  <line x1="670" y1="480" x2="520" y2="355" stroke="#5D4037" stroke-width="1.5" stroke-dasharray="6,3"/>
  <polygon points="517,352 527,348 523,358" fill="#5D4037"/>
  <text x="610" y="430" font-family="Arial, sans-serif" font-size="11" fill="#5D4037">Gere les campagnes</text>
  <text x="610" y="445" font-family="Arial, sans-serif" font-size="11" fill="#5D4037">et evenements</text>
  
  <!-- Legend box -->
  <rect x="20" y="20" width="90" height="25" fill="#FFFBEB" stroke="#D4A574" stroke-width="1"/>
  <text x="65" y="37" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#8B7355">uc Actors</text>
</svg>
