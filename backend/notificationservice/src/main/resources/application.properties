spring.application.name=notificationservice

server.port=7010

spring.cloud.config.enabled=true

spring.config.import=optional:configserver:http://localhost:8888

# Spring Batch Configuration
# Désactive le démarrage automatique des jobs au démarrage de l'application
spring.batch.job.enabled=false
# Configuration de la base de données pour Spring Batch (utilise la même DB que JPA)
spring.batch.jdbc.initialize-schema=always

# Spring Mail Configuration (pour l'envoi d'emails)
# Configuration par défaut - à configurer selon votre serveur SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=chakourimad01@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.from=noreply@eventflow.com

# Note: Pour utiliser Gmail, vous devez :
# 1. Activer "Accès aux applications moins sécurisées" OU
# 2. Utiliser un "Mot de passe d'application" (recommandé)
# 3. Définir les variables d'environnement MAIL_USERNAME et MAIL_PASSWORD