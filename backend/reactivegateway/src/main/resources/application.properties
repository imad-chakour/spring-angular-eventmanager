# Application Configuration
spring.application.name=reactivegateway
server.port=1111

# Spring Cloud Gateway Configuration (Updated property names)
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# WebFlux Configuration
spring.main.web-application-type=reactive

# Eureka Client Configuration
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Eureka Instance Configuration
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false

# Config Server (disabled as per your config)
spring.cloud.config.enabled=false

# Actuator Configuration (Updated)
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# JWT Configuration (must match userservice)
security.jwt.secret=A4kVIT9eXHnjs8dRXXg3om0HXbQ/MAAev34MH89QM5o=
security.jwt.expiration-ms=86400000

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.cloud.loadbalancer=DEBUG
logging.level.reactor.netty.http.client=DEBUG
logging.level.com.example.reactivegateway=DEBUG
logging.level.com.example.reactivegateway.security=DEBUG
logging.level.com.example.reactivegateway.filters=DEBUG

# Allow bean overriding (remove if not needed)
# spring.main.allow-bean-definition-overriding=true
